# The messages format version. Do not change this value.
version: 2

# ───────────────────────────────────────────────────────────────────────────────
# Variables
# Reusable variables that can be used throughout the messages.
# Usage: <variable_name> will be replaced with the defined value.
# ───────────────────────────────────────────────────────────────────────────────
variables:
  prefix: '<color:#38bdf8><bold>⚡</bold></color>'

# ───────────────────────────────────────────────────────────────────────────────
# Kick Messages
# ───────────────────────────────────────────────────────────────────────────────
kick:
  no-fallback-servers: '<color:#dc2626>There is no fallback server available.'
  no-target-connection: '<color:#dc2626>You have been disconnected from the network<br>because there are no fallback servers available.'

# ───────────────────────────────────────────────────────────────────────────────
# Command Messages
# ───────────────────────────────────────────────────────────────────────────────
command:
  command-usage: '<prefix> <color:#ffffff>Usage: /connection reload'
  config-reloading: '<prefix> <color:#ffffff>Reloading Connection configurations...'
  config-reloaded-success: '<prefix> <color:#22c55e>Successfully reloaded all Connection configurations.'
  config-reloaded-failed: '<prefix> <color:#dc2626>Failed to reload Connection configurations.'
